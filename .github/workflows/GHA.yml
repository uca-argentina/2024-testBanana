name: CI

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        smalltalk:
          - Pharo32-8.0
          - Pharo64-8.0
          - Pharo64-9.0
          - Pharo64-10
          - Pharo64-11
          - Pharo64-12

    name: ${{ matrix.smalltalk }}

    steps:
      - uses: actions/checkout@v4

      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}

      - name: Download Pharo 8 image
        if: matrix.smalltalk == 'Pharo64-8.0' || matrix.smalltalk == 'Pharo32-8.0'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .ci/pharo8

          if [[ "${{ matrix.smalltalk }}" == "Pharo64-8.0" ]]; then
            IMAGE_URL="https://files.pharo.org/image/80/stable-64.zip"
          else
            IMAGE_URL="https://files.pharo.org/image/80/stable-32.zip"
          fi

          echo "Downloading $IMAGE_URL"

          curl -fL \
            "$IMAGE_URL" \
            -o .ci/pharo8/pharo8.zip

          unzip -q \
            .ci/pharo8/pharo8.zip \
            -d .ci/pharo8

          IMAGE_FILE=$(find .ci/pharo8 -type f -name '*.image' -print -quit)

          if [[ -z "$IMAGE_FILE" ]]; then
            echo "The downloaded ZIP does not contain a Pharo image."
            exit 1
          fi

          echo "Using image: $IMAGE_FILE"
          echo "PHARO8_IMAGE=$IMAGE_FILE" >> "$GITHUB_ENV"

      - name: Run smalltalkCI on Pharo 8
        if: matrix.smalltalk == 'Pharo64-8.0' || matrix.smalltalk == 'Pharo32-8.0'
        shell: bash
        timeout-minutes: 6
        run: |
          smalltalkci \
            -s "${{ matrix.smalltalk }}" \
            --image "$PHARO8_IMAGE"

      - name: Run smalltalkCI
        if: matrix.smalltalk != 'Pharo64-8.0' && matrix.smalltalk != 'Pharo32-8.0'
        shell: bash
        timeout-minutes: 6
        run: |
          smalltalkci -s "${{ matrix.smalltalk }}"

  finish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.github_token }}
          parallel-finished: true