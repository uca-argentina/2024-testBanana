name: CI

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        smalltalk:
          - Pharo32-8.0
          - Pharo64-8.0
          - Pharo64-9.0
          - Pharo64-10
          - Pharo64-11
          - Pharo64-12

    name: ${{ matrix.smalltalk }}

    steps:
      - uses: actions/checkout@v4

      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}

      - name: Download Pharo 8 image
        if: matrix.smalltalk == 'Pharo64-8.0' || matrix.smalltalk == 'Pharo32-8.0'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .ci/pharo8/image

          if [[ "${{ matrix.smalltalk }}" == "Pharo64-8.0" ]]; then
            IMAGE_URL="https://files.pharo.org/image/80/stable-64.zip"
          else
            IMAGE_URL="https://files.pharo.org/image/80/stable-32.zip"
          fi

          echo "Downloading image: $IMAGE_URL"

          curl -fL \
            "$IMAGE_URL" \
            -o .ci/pharo8/image.zip

          unzip -q \
            .ci/pharo8/image.zip \
            -d .ci/pharo8/image

          IMAGE_FILE=$(find .ci/pharo8/image -type f -name '*.image' -print -quit)

          if [[ -z "$IMAGE_FILE" ]]; then
            echo "The downloaded ZIP does not contain a Pharo image."
            exit 1
          fi

          echo "Using image: $IMAGE_FILE"
          echo "PHARO8_IMAGE=$IMAGE_FILE" >> "$GITHUB_ENV"

      - name: Download Pharo 8 64-bit VM
        if: matrix.smalltalk == 'Pharo64-8.0'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .ci/pharo8/vm

          VM_URL="https://files.pharo.org/vm/pharo-spur64/linux/stable-threaded-20201102.zip"

          echo "Downloading VM: $VM_URL"

          curl -fL \
            "$VM_URL" \
            -o .ci/pharo8/vm.zip

          unzip -q \
            .ci/pharo8/vm.zip \
            -d .ci/pharo8/vm

          VM_FILE=$(find .ci/pharo8/vm -name 'pharo' -print -quit)

          if [[ -z "$VM_FILE" ]]; then
            echo "The downloaded ZIP does not contain the Pharo VM executable."
            find .ci/pharo8/vm -maxdepth 4 -type f
            exit 1
          fi

          chmod +x "$VM_FILE"

          echo "Using VM: $VM_FILE"
          echo "PHARO8_VM=$VM_FILE" >> "$GITHUB_ENV"

      - name: Run smalltalkCI on Pharo64-8.0
        if: matrix.smalltalk == 'Pharo64-8.0'
        shell: bash
        timeout-minutes: 10
        run: |
          smalltalkci \
            -s Pharo64-8.0 \
            --image "$PHARO8_IMAGE" \
            --vm "$PHARO8_VM"

      - name: Run smalltalkCI on Pharo32-8.0
        if: matrix.smalltalk == 'Pharo32-8.0'
        shell: bash
        timeout-minutes: 10
        run: |
          smalltalkci \
            -s Pharo32-8.0 \
            --image "$PHARO8_IMAGE"

      - name: Run smalltalkCI
        if: matrix.smalltalk != 'Pharo64-8.0' && matrix.smalltalk != 'Pharo32-8.0'
        shell: bash
        timeout-minutes: 10
        run: |
          smalltalkci -s "${{ matrix.smalltalk }}"

  finish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.github_token }}
          parallel-finished: true