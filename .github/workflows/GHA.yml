name: CI

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        smalltalk:
          - Pharo32-8.0
          - Pharo64-8.0
          - Pharo64-9.0
          - Pharo64-10
          - Pharo64-11
          - Pharo64-12

    name: ${{ matrix.smalltalk }}

    steps:
      - uses: actions/checkout@v4

      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}

      - name: Download Pharo 8 64-bit image
        if: matrix.smalltalk == 'Pharo64-8.0'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .ci/pharo8

          IMAGE_ZIP=$(
            curl -fsSL "https://files.pharo.org/image/80/" |
            grep -oE 'href="[^"]*64bit[^"]*\.zip"' |
            cut -d'"' -f2 |
            grep -E 'Pharo8\.0' |
            grep -vE '(alpha|beta|rc)' |
            sort -V |
            tail -n 1
          )

          if [[ -z "$IMAGE_ZIP" ]]; then
            IMAGE_ZIP=$(
              curl -fsSL "https://files.pharo.org/image/80/" |
              grep -oE 'href="[^"]*64bit[^"]*\.zip"' |
              cut -d'"' -f2 |
              grep -E 'Pharo8\.0' |
              sort -V |
              tail -n 1
            )
          fi

          if [[ -z "$IMAGE_ZIP" ]]; then
            echo "No se encontró una imagen Pharo 8 de 64 bits."
            exit 1
          fi

          IMAGE_ZIP="${IMAGE_ZIP#./}"

          echo "Descargando $IMAGE_ZIP"

          curl -fL \
            "https://files.pharo.org/image/80/$IMAGE_ZIP" \
            -o .ci/pharo8/pharo8.zip

          unzip -q .ci/pharo8/pharo8.zip -d .ci/pharo8

          IMAGE_FILE=$(find .ci/pharo8 -type f -name '*.image' | head -n 1)

          if [[ -z "$IMAGE_FILE" ]]; then
            echo "El archivo descargado no contiene una imagen de Pharo."
            exit 1
          fi

          echo "PHARO8_IMAGE=$IMAGE_FILE" >> "$GITHUB_ENV"

      - name: Run smalltalkCI on Pharo64-8.0
        if: matrix.smalltalk == 'Pharo64-8.0'
        shell: bash
        timeout-minutes: 6
        run: |
          smalltalkci \
            -s Pharo64-8.0 \
            --image "$PHARO8_IMAGE"

      - name: Run smalltalkCI
        if: matrix.smalltalk != 'Pharo64-8.0'
        shell: bash
        timeout-minutes: 6
        run: |
          smalltalkci -s "${{ matrix.smalltalk }}"

  finish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.github_token }}
          parallel-finished: true